<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Historias - Automatización</title>
    <style>
        /* ===== RESET Y BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #f9f0ff 0%, #ffe6f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            padding: 20px;
            margin: 0;
        }
        /* ===== CONTENEDOR PRINCIPAL ===== */
        .container {
            max-width: 950px;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 48px 48px 32px 32px;
            padding: 40px 45px 50px;
            box-shadow: 0 25px 70px rgba(255, 105, 180, 0.2), 0 0 0 1px rgba(255, 182, 193, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }
        .container::before, .container::after {
            content: "";
            position: fixed;
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
        }
        .container::before {
            top: -15%; left: -10%; width: 50%; height: 50%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 182, 193, 0.06) 0%, transparent 70%);
        }
        .container::after {
            bottom: -10%; right: -5%; width: 40%; height: 40%;
            background: radial-gradient(circle at 70% 60%, rgba(162, 155, 254, 0.05) 0%, transparent 70%);
        }

        /* ===== TÍTULO CON BANDERA (IMAGEN) ===== */
        .titulo {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .titulo h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #a29bfe, #fd79a8, #ff6b6b);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: arcoiris 7s ease-in-out infinite alternate;
            text-shadow: 0 4px 20px rgba(255, 105, 180, 0.15);
            line-height: 1.2;
            margin: 0;
        }
        @keyframes arcoiris {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Bandera imagen */
        .bandera-img {
            width: 2.4rem;
            height: 2.4rem;
            flex-shrink: 0;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(255, 105, 180, 0.2));
        }

        /* ===== TEXTO INFORMATIVO ===== */
        .container p {
            font-size: 1.05rem;
            color: #5a3d5a;
            margin-bottom: 28px;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.5);
            padding: 14px 24px;
            border-radius: 60px;
            display: inline-block;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 182, 193, 0.2);
            box-shadow: 0 2px 12px rgba(255, 105, 180, 0.06);
        }
        .container p::before { content: "✨ "; }
        .container p::after  { content: " ✨"; }

        /* ===== IMAGEN DEL COORDINADOR ===== */
        .container img {
            display: block;
            max-width: 130px;
            width: 100%;
            height: auto;
            border-radius: 50%;
            border: 4px solid #ffb6c1;
            box-shadow: 0 0 0 8px rgba(255, 182, 193, 0.15), 0 10px 30px rgba(255, 105, 180, 0.12);
            margin: 0 auto 28px auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            object-fit: cover;
        }
        .container img:hover {
            transform: scale(1.04) rotate(2deg);
            box-shadow: 0 0 0 12px rgba(255, 182, 193, 0.2), 0 15px 40px rgba(255, 105, 180, 0.2);
        }

        /* ===== ETIQUETAS Y TEXTAREA ===== */
        label {
            font-weight: 600;
            color: #4a2c4a;
            display: block;
            margin-top: 6px;
            margin-bottom: 8px;
            font-size: 1.05rem;
            letter-spacing: 0.3px;
        }
        textarea {
            width: 100%;
            padding: 18px 22px;
            border-radius: 28px;
            border: 2px solid #f8d7e0;
            background: rgba(255, 245, 250, 0.7);
            backdrop-filter: blur(4px);
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 130px;
            transition: border 0.3s, box-shadow 0.3s;
            color: #2d1b2d;
            box-shadow: inset 0 2px 8px rgba(255, 105, 180, 0.04);
        }
        textarea:focus {
            outline: none;
            border-color: #ff8a9c;
            box-shadow: 0 0 0 6px rgba(255, 138, 156, 0.12), inset 0 2px 8px rgba(255, 105, 180, 0.08);
        }

        /* ===== CONTROLES ===== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 20px;
            margin: 28px 0 22px;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(6px);
            border-radius: 60px;
            border: 1px solid rgba(255, 182, 193, 0.25);
            box-shadow: 0 2px 12px rgba(255, 105, 180, 0.04);
        }
        .controls button {
            padding: 12px 32px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.25s ease;
            background: linear-gradient(135deg, #ff8a9c, #ff6b8a);
            color: white;
            box-shadow: 0 6px 24px rgba(255, 105, 180, 0.3);
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .controls button:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 36px rgba(255, 105, 180, 0.4);
        }
        .controls button:active {
            transform: translateY(0) scale(0.97);
        }
        .controls button#btnLimpiar {
            background: linear-gradient(135deg, #b8a9c9, #9b8bb5);
            box-shadow: 0 6px 24px rgba(155, 139, 181, 0.3);
        }
        .controls button#btnLimpiar:hover {
            box-shadow: 0 12px 36px rgba(155, 139, 181, 0.4);
        }
        .controls button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .controls span {
            color: #4a2c4a;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .file-input {
            padding: 8px 16px;
            border-radius: 60px;
            border: 2px dashed #f8b0c0;
            background: rgba(255, 245, 250, 0.5);
            cursor: pointer;
            font-size: 0.95rem;
            color: #4a2c4a;
            transition: border 0.3s, background 0.3s;
        }
        .file-input:hover {
            border-color: #ff8a9c;
            background: rgba(255, 235, 240, 0.7);
        }
        .controls label[for="urlBase"] {
            display: inline;
            margin: 0;
            font-weight: 500;
            color: #4a2c4a;
            font-size: 0.95rem;
        }
        #urlBase {
            padding: 10px 20px;
            border-radius: 60px;
            border: 2px solid #f8d7e0;
            background: rgba(255, 245, 250, 0.6);
            font-size: 0.95rem;
            font-family: inherit;
            transition: border 0.3s, box-shadow 0.3s;
            flex: 1 1 180px;
            min-width: 150px;
        }
        #urlBase:focus {
            outline: none;
            border-color: #ff8a9c;
            box-shadow: 0 0 0 4px rgba(255, 138, 156, 0.12);
        }

        /* ===== ÁREA DE RESULTADOS ===== */
        #resultados {
            margin-top: 20px;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            border: 1px solid rgba(255, 182, 193, 0.2);
            max-height: 480px;
            overflow-y: auto;
            box-shadow: inset 0 2px 12px rgba(255, 105, 180, 0.04);
        }
        #resultados::-webkit-scrollbar {
            width: 8px;
        }
        #resultados::-webkit-scrollbar-track {
            background: rgba(255, 182, 193, 0.1);
            border-radius: 20px;
        }
        #resultados::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff8a9c, #ff6b8a);
            border-radius: 20px;
        }
        #resultados .status {
            padding: 12px 20px;
            margin-bottom: 12px;
            border-radius: 60px;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(2px);
            border-left: 6px solid #b8a9c9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            word-break: break-word;
        }
        #resultados .status.info    { border-left-color: #74b9ff; background: rgba(116, 185, 255, 0.07); }
        #resultados .status.success { border-left-color: #55efc4; background: rgba(85, 239, 196, 0.07); }
        #resultados .status.error   { border-left-color: #ff7675; background: rgba(255, 118, 117, 0.07); }
        #resultados details {
            margin: 8px 0 14px 20px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            border: 1px solid rgba(255, 182, 193, 0.15);
        }
        #resultados details summary {
            cursor: pointer;
            font-weight: 500;
            color: #6a4c6a;
            transition: color 0.2s;
        }
        #resultados details summary:hover {
            color: #ff6b8a;
        }
        #resultados details pre {
            margin-top: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 16px;
            font-size: 0.85rem;
            overflow-x: auto;
            color: #2d1b2d;
            border: 1px solid rgba(255, 182, 193, 0.1);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 750px) {
            .container { padding: 24px 20px 30px; border-radius: 32px; }
            .titulo h1 { font-size: 2.2rem; }
            .bandera-img { width: 2rem; height: 2rem; }
            .controls { flex-direction: column; align-items: stretch; border-radius: 32px; gap: 12px; padding: 18px; }
            .controls button { justify-content: center; white-space: normal; }
            #urlBase { min-width: unset; flex: 1; }
            .container img { max-width: 110px; }
        }
        @media (max-width: 450px) {
            .titulo h1 { font-size: 1.8rem; }
            .bandera-img { width: 1.6rem; height: 1.6rem; }
            .container p { font-size: 0.9rem; padding: 10px 16px; }
            #resultados .status { font-size: 0.85rem; padding: 10px 14px; }
            .controls { padding: 14px; gap: 10px; }
            .controls button { padding: 10px 20px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Título con bandera imagen -->
    <div class="titulo">
        <img class="bandera-img"
             src="https://upload.wikimedia.org/wikipedia/commons/4/48/Gay_Pride_Flag.svg"
             alt="Bandera arcoíris" />
        <h1>Generador de Historias Clínicas</h1>
    </div>

    <p>Ingresa los números de admisión (uno por línea) y haz clic en "Procesar".</p>
    <img src="https://hospitalsanjorgeayapel.gov.co/LectorPdf/Img/funcionario/Neder%20Jer%C3%B3nimo-%20Ortega-Coordinador%20TIC-SI.jpg" alt="Coordinador" />

    <label for="admisiones">Números de Admisión:</label>
    <textarea id="admisiones" placeholder="Ejemplo:&#10;191777&#10;191778&#10;191779">191777</textarea>

    <div class="controls">
        <button id="btnProcesar">▶ Procesar</button>
        <button id="btnLimpiar">🗑 Limpiar resultados</button>
        <span>o cargar .txt:</span>
        <input type="file" id="fileInput" accept=".txt" class="file-input" />
        <label for="urlBase">URL base:</label>
        <input type="text" id="urlBase" value="" placeholder="Ej: http://localhost:3000" />
    </div>

    <div id="resultados">
        <span class="info">⏳ Los resultados aparecerán aquí.</span>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ===== REFERENCIAS DOM =====
        const resultadosDiv = document.getElementById('resultados');
        const admisionesTextarea = document.getElementById('admisiones');
        const btnProcesar = document.getElementById('btnProcesar');
        const btnLimpiar = document.getElementById('btnLimpiar');
        const fileInput = document.getElementById('fileInput');
        const urlBaseInput = document.getElementById('urlBase');

        // ===== FUNCIÓN PARA AGREGAR MENSAJE =====
        function agregarMensaje(mensaje, tipo = 'info') {
            const p = document.createElement('div');
            p.className = `status ${tipo}`;
            p.textContent = mensaje;
            resultadosDiv.appendChild(p);
            resultadosDiv.scrollTop = resultadosDiv.scrollHeight;
        }

        // ===== LIMPIAR RESULTADOS =====
        function limpiarResultados() {
            resultadosDiv.innerHTML = '';
            agregarMensaje('🧹 Resultados limpiados.', 'info');
        }

        // ===== PROCESAR ADMISIONES =====
        async function procesarAdmisiones() {
            const texto = admisionesTextarea.value.trim();
            if (!texto) {
                alert('Por favor ingresa al menos un número de admisión.');
                return;
            }
            const numeros = texto.split('\n')
                .map(line => line.trim())
                .filter(num => num !== '' && !isNaN(num));
            if (numeros.length === 0) {
                alert('No se encontraron números válidos.');
                return;
            }

            let baseUrl = urlBaseInput.value.trim();
            if (baseUrl === '') baseUrl = window.location.origin;
            if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);

            btnProcesar.disabled = true;
            agregarMensaje(`⏳ Iniciando procesamiento de ${numeros.length} admisiones...`, 'info');

            const exitosos = [];
            const fallidos = [];

            for (const adm of numeros) {
                const url = `${baseUrl}/GeneradorHs?numeroAdmision=${adm}`;
                agregarMensaje(`🔄 Solicitando admisión ${adm}...`, 'info');

                try {
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const data = await response.json();

                    if (data.success === true) {
                        let detalle = '';
                        if (data.guardado) {
                            const g = data.guardado;
                            detalle = `ID: ${g.id || 'N/A'}, Nº: ${g.numero_admision || adm}, ` +
                                      `Fecha: ${g.fecha_hora || 'N/A'}, Resultado: ${g.resultado || 'OK'}`;
                        } else if (data.admision) {
                            const a = data.admision;
                            detalle = `Bloqueada: ${a.bloqueada ?? 'N/A'}`;
                        } else {
                            detalle = `Mensaje: ${data.mensaje || 'Éxito sin detalles'}`;
                        }
                        agregarMensaje(`✅ Admisión ${adm} → SUBIDA ✅ (${detalle})`, 'success');
                        exitosos.push(adm);
                    } else {
                        const motivo = data.mensaje || data.error || data.message || 'Error desconocido en el servidor';
                        agregarMensaje(`❌ Admisión ${adm} → FALLÓ ❌: ${motivo}`, 'error');
                        fallidos.push(adm);
                    }

                    const detalleJson = document.createElement('details');
                    const summary = document.createElement('summary');
                    summary.textContent = `📄 Ver respuesta JSON para ${adm}`;
                    detalleJson.appendChild(summary);
                    const pre = document.createElement('pre');
                    pre.textContent = JSON.stringify(data, null, 2);
                    detalleJson.appendChild(pre);
                    resultadosDiv.appendChild(detalleJson);

                } catch (error) {
                    agregarMensaje(`❌ Admisión ${adm} → FALLÓ ❌: ${error.message}`, 'error');
                    fallidos.push(adm);
                }
            }

            let resumen = `🏁 Procesamiento finalizado. Total: ${numeros.length}, ` +
                          `Éxitos: ${exitosos.length}, Fallos: ${fallidos.length}`;
            if (fallidos.length > 0) {
                resumen += ` | Números fallidos: ${fallidos.join(', ')}`;
            }
            agregarMensaje(resumen, 'info');

            btnProcesar.disabled = false;
        }

        // ===== CARGAR ARCHIVO =====
        function cargarArchivoTexto(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const contenido = e.target.result;
                admisionesTextarea.value = contenido;
                const lineas = contenido.split('\n').filter(l => l.trim() !== '').length;
                agregarMensaje(`📂 Archivo "${file.name}" cargado con ${lineas} líneas.`, 'info');
            };
            reader.onerror = function() {
                alert('Error al leer el archivo.');
            };
            reader.readAsText(file);
        }

        // ===== EVENT LISTENERS =====
        btnProcesar.addEventListener('click', procesarAdmisiones);
        btnLimpiar.addEventListener('click', limpiarResultados);

        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                cargarArchivoTexto(this.files[0]);
            }
            this.value = '';
        });

        admisionesTextarea.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                btnProcesar.click();
            }
        });

        agregarMensaje('💡 Listo. Ingresa números de admisión y presiona "Procesar".', 'info');
    })();
</script>
</body>
</html>
