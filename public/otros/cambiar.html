<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CORE_INVOICE v3.3 — Edición Elegante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14;
    --panel:#101722;
    --line:rgba(212,175,95,.18);
    --line-strong:rgba(212,175,95,.45);
    --gold:#d4af5f;
    --gold-2:#f0d9a4;
    --text:#e9ecf3;
    --muted:#8592a6;
    --danger:#e0728a;
    --soft:rgba(255,255,255,.06);
  }
  *{ box-sizing:border-box; }
  html,body{ min-height:100%; }
  body{
    margin:0;
    padding:36px 20px 60px;
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 620px at 12% -12%, rgba(212,175,95,.10), transparent 62%),
      radial-gradient(900px 520px at 102% -4%, rgba(70,110,190,.12), transparent 58%),
      var(--bg);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    -webkit-font-smoothing:antialiased;
  }
  input, button{ font-family:inherit; }

  /* ================= Tarjeta principal ================= */
  .app{
    position:relative;
    width:100%;
    max-width:920px;
    padding:34px 34px 28px;
    border:1px solid var(--line);
    border-radius:22px;
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.012));
    box-shadow:0 44px 100px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(10px);
    animation:rise .75s cubic-bezier(.2,.7,.3,1) both;
  }
  .app::before{
    content:"";
    position:absolute; top:0; left:34px; right:34px; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:.55;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(18px) scale(.985); }
    to{ opacity:1; transform:none; }
  }

  /* ================= Cabecera ================= */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:18px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:16px; }
  .mark{
    width:52px; height:52px; flex:0 0 auto;
    display:grid; place-items:center;
    border:1px solid var(--line-strong);
    border-radius:14px;
    background:linear-gradient(160deg, rgba(212,175,95,.16), rgba(212,175,95,.02));
    font-family:'Playfair Display', serif;
    font-size:1.15rem; font-weight:700; letter-spacing:.06em;
    color:var(--gold-2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  }
  .brand h1{
    margin:0;
    font-family:'Playfair Display', serif;
    font-size:1.34rem;
    font-weight:600;
    letter-spacing:.11em;
    text-transform:uppercase;
  }
  .brand h1 span{
    font-family:'Inter', sans-serif;
    font-size:.62rem;
    font-weight:600;
    letter-spacing:.22em;
    color:var(--gold);
    vertical-align:middle;
    margin-left:8px;
    border:1px solid var(--line-strong);
    border-radius:6px;
    padding:3px 7px;
  }
  .tag{
    margin:7px 0 0;
    font-size:.66rem;
    font-weight:500;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .pill{
    display:inline-flex; align-items:center; gap:9px;
    padding:9px 16px;
    border:1px solid var(--line-strong);
    border-radius:999px;
    background:rgba(212,175,95,.05);
    font-size:.62rem; font-weight:600;
    letter-spacing:.22em; text-transform:uppercase;
    color:var(--gold-2);
    white-space:nowrap;
  }
  .pill .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 10px var(--gold);
  }

  /* ================= Datos ================= */
  .meta-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
    margin-top:28px;
  }
  .card{
    padding:18px 18px 14px;
    border:1px solid rgba(255,255,255,.055);
    border-radius:14px;
    background:var(--panel);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  }
  .card h2{
    margin:0 0 14px;
    font-size:.62rem; font-weight:700;
    letter-spacing:.24em; text-transform:uppercase;
    color:var(--gold);
  }
  .field{ display:block; margin-bottom:13px; }
  .field:last-child{ margin-bottom:0; }
  .field span{
    display:block;
    font-size:.58rem; font-weight:600;
    letter-spacing:.17em; text-transform:uppercase;
    color:var(--muted);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:7px 2px;
    background:transparent;
    border:0;
    border-bottom:1px solid rgba(255,255,255,.1);
    color:var(--text);
    font-size:.88rem;
    font-weight:500;
    transition:border-color .22s ease, background .22s ease;
  }
  .field input::placeholder{ color:#525c6d; }
  .field input:focus{
    outline:none;
    border-bottom-color:var(--gold);
    background:linear-gradient(180deg, transparent, rgba(212,175,95,.07));
  }
  input[type="date"]{ color-scheme:dark; }

  /* ================= Conceptos ================= */
  .items{ margin-top:32px; }
  .items-title{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; margin-bottom:12px;
  }
  .items-title h2{
    margin:0;
    font-family:'Playfair Display', serif;
    font-size:1.02rem; font-weight:600;
    letter-spacing:.06em;
  }
  .items-title .hint{
    font-size:.64rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted);
  }
  .items-head, .row{
    display:grid;
    grid-template-columns:1fr 80px 118px 118px 34px;
    gap:12px;
    align-items:center;
  }
  .items-head{
    padding:0 0 10px;
    border-bottom:1px solid var(--line);
    font-size:.58rem; font-weight:700;
    letter-spacing:.2em; text-transform:uppercase;
    color:var(--muted);
  }
  .items-head span:nth-child(2),
  .items-head span:nth-child(3),
  .items-head span:nth-child(4){ text-align:right; }

  .row{
    padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,.05);
    transition:background .2s ease;
  }
  .row:focus-within{ background:rgba(212,175,95,.035); }
  .row input{
    width:100%;
    padding:8px 6px;
    background:transparent;
    border:1px solid transparent;
    border-radius:8px;
    color:var(--text);
    font-size:.9rem;
    font-weight:500;
    transition:.2s ease;
  }
  .row input::placeholder{ color:#525c6d; font-weight:400; }
  .row input:focus{
    outline:none;
    border-color:var(--line-strong);
    background:rgba(212,175,95,.07);
  }
  .r-qty, .r-price{ text-align:right; font-variant-numeric:tabular-nums; }
  .r-amount{
    text-align:right;
    font-weight:600;
    font-size:.9rem;
    color:var(--gold-2);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .r-del{
    width:30px; height:30px;
    display:grid; place-items:center;
    padding:0;
    border:1px solid transparent;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    font-size:1.15rem; line-height:1;
    cursor:pointer;
    transition:.2s ease;
  }
  .r-del:hover{
    color:var(--danger);
    border-color:rgba(224,114,138,.4);
    background:rgba(224,114,138,.1);
  }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  .add-row{
    width:100%;
    margin-top:14px;
    padding:13px;
    border:1px dashed var(--line-strong);
    border-radius:12px;
    background:transparent;
    color:var(--gold);
    font-size:.68rem; font-weight:700;
    letter-spacing:.2em; text-transform:uppercase;
    cursor:pointer;
    transition:.22s ease;
  }
  .add-row:hover{
    background:rgba(212,175,95,.08);
    border-style:solid;
    color:var(--gold-2);
  }
  .add-row:active{ transform:translateY(1px); }

  /* ================= Totales ================= */
  .summary{
    margin:26px 0 0 auto;
    width:100%;
    max-width:360px;
  }
  .sum-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    padding:9px 0;
    font-size:.86rem;
    color:var(--muted);
  }
  .sum-row strong{
    color:var(--text);
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  #taxRow{ transition:opacity .25s ease; }
  .switch{
    display:inline-flex; align-items:center; gap:9px;
    cursor:pointer;
    font-size:.76rem; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted);
  }
  .switch input{
    width:16px; height:16px;
    accent-color:var(--gold);
    cursor:pointer;
    margin:0;
  }
  .sum-total{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:16px;
    margin-top:10px;
    padding-top:15px;
    border-top:1px solid var(--line-strong);
  }
  .sum-total span{
    font-size:.66rem; font-weight:700;
    letter-spacing:.24em; text-transform:uppercase;
    color:var(--gold);
  }
  .sum-total strong{
    font-family:'Playfair Display', serif;
    font-size:1.9rem;
    font-weight:700;
    color:var(--gold-2);
    font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
  }

  /* ================= Acciones ================= */
  .actions{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px; flex-wrap:wrap;
    margin-top:30px;
    padding-top:22px;
    border-top:1px solid rgba(255,255,255,.07);
  }
  .actions-right{ display:flex; gap:12px; flex-wrap:wrap; }
  .btn{
    padding:13px 24px;
    border-radius:12px;
    border:1px solid transparent;
    font-size:.68rem; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase;
    cursor:pointer;
    transition:.22s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-ghost{
    background:transparent;
    border-color:rgba(255,255,255,.13);
    color:var(--text);
  }
  .btn-ghost:hover{
    border-color:var(--line-strong);
    color:var(--gold-2);
    background:rgba(212,175,95,.06);
  }
  .btn-gold{
    background:linear-gradient(180deg, #f0d9a4, #c9a24b);
    color:#1a1206;
    box-shadow:0 12px 26px rgba(212,175,95,.22);
  }
  .btn-gold:hover{
    transform:translateY(-1px);
    box-shadow:0 16px 32px rgba(212,175,95,.3);
    filter:brightness(1.04);
  }
  .legal{
    font-size:.62rem;
    letter-spacing:.1em;
    color:#5d6678;
    margin:0;
    max-width:320px;
    line-height:1.6;
  }

  /* ================= Aviso flotante ================= */
  .toast{
    position:fixed;
    left:50%; bottom:28px;
    transform:translate(-50%, 20px);
    padding:13px 22px;
    border:1px solid var(--line-strong);
    border-radius:12px;
    background:rgba(16,23,34,.97);
    color:var(--gold-2);
    font-size:.72rem; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
    opacity:0;
    pointer-events:none;
    transition:.32s cubic-bezier(.2,.7,.3,1);
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ================= Responsive ================= */
  @media (max-width:780px){
    body{ padding:20px 14px 44px; }
    .app{ padding:24px 20px 22px; border-radius:18px; }
    .app::before{ left:20px; right:20px; }
    .meta-grid{ grid-template-columns:1fr; gap:12px; }
    .items-head{ display:none; }
    .row{
      grid-template-columns:1fr 1fr 34px;
      gap:10px;
      padding:15px 0;
    }
    .r-desc{ grid-column:1 / -1; }
    .r-qty{ grid-column:1; }
    .r-price{ grid-column:2; }
    .r-del{ grid-column:3; grid-row:2; justify-self:end; }
    .r-amount{
      grid-column:1 / -1;
      text-align:right;
      padding-top:9px;
      border-top:1px dashed rgba(255,255,255,.09);
    }
    .summary{ max-width:100%; }
    .actions{ flex-direction:column; align-items:stretch; }
    .actions-right{ justify-content:flex-end; }
    .legal{ max-width:100%; order:2; }
  }

  /* ================= Impresión ================= */
  @media print{
    @page{ margin:16mm; }
    body{
      background:#fff !important;
      color:#111;
      padding:0;
      display:block;
    }
    .app{
      border:none; box-shadow:none; background:#fff;
      max-width:100%; padding:0; backdrop-filter:none;
    }
    .app::before{ display:none; }
    .mark{ border-color:#c9a24b; color:#8a6d2f; }
    .pill{ border-color:#ccc; color:#555; }
    .card{ background:#fff; border-color:#e3e3e3; }
    .field span, .items-head, .tag, .items-title .hint, .switch, .sum-row, .legal{ color:#666; }
    .field input, .row input{ color:#111; border-bottom-color:#ddd; }
    .row{ border-bottom:1px solid #eee; }
    .r-amount, .sum-row strong{ color:#111; }
    .sum-total{ border-top-color:#c9a24b; }
    .sum-total span{ color:#8a6d2f; }
    .sum-total strong{ color:#111; }
    .actions, .add-row, .r-del, .toast{ display:none !important; }
  }
</style>
</head>
<body>

<main class="app">

  <!-- ======= Cabecera ======= -->
  <header class="topbar">
    <div class="brand">
      <div class="mark">CI</div>
      <div>
        <h1>CORE_INVOICE <span>v3.3</span></h1>
        <p class="tag">Facturación profesional · Edición Elegante</p>
      </div>
    </div>
    <div class="pill" id="statusPill">
      <span class="dot"></span>
      <span id="statusText">Borrador</span>
    </div>
  </header>

  <!-- ======= Datos ======= -->
  <section class="meta-grid">

    <div class="card">
      <h2>Emisor</h2>
      <label class="field">
        <span>Razón social</span>
        <input id="senderName" value="Nexo Studio S.A.S." autocomplete="off" />
      </label>
      <label class="field">
        <span>NIT / Documento</span>
        <input id="senderDoc" value="901.458.220-7" autocomplete="off" />
      </label>
      <label class="field">
        <span>Correo</span>
        <input id="senderEmail" type="email" value="facturacion@nexostudio.co" autocomplete="off" />
      </label>
    </div>

    <div class="card">
      <h2>Cliente</h2>
      <label class="field">
        <span>Nombre / Empresa</span>
        <input id="clientName" placeholder="Nombre del cliente" autocomplete="off" />
      </label>
      <label class="field">
        <span>NIT / Documento</span>
        <input id="clientDoc" placeholder="900.000.000-0" autocomplete="off" />
      </label>
      <label class="field">
        <span>Correo</span>
        <input id="clientEmail" type="email" placeholder="cliente@empresa.com" autocomplete="off" />
      </label>
    </div>

    <div class="card">
      <h2>Detalles</h2>
      <label class="field">
        <span>N.º de factura</span>
        <input id="invNumber" autocomplete="off" />
      </label>
      <label class="field">
        <span>Fecha de emisión</span>
        <input id="issueDate" type="date" />
      </label>
      <label class="field">
        <span>Vencimiento</span>
        <input id="dueDate" type="date" />
      </label>
    </div>

  </section>

  <!-- ======= Conceptos ======= -->
  <section class="items">
    <div class="items-title">
      <h2>Conceptos</h2>
      <span class="hint">Cálculo automático</span>
    </div>

    <div class="items-head">
      <span>Descripción</span>
      <span>Cant.</span>
      <span>Precio unit.</span>
      <span>Importe</span>
      <span></span>
    </div>

    <div id="rows"></div>

    <button class="add-row" id="addBtn" type="button">+ Añadir concepto</button>
  </section>

  <!-- ======= Totales ======= -->
  <section class="summary">
    <div class="sum-row">
      <span>Subtotal</span>
      <strong id="subtotal">$ 0</strong>
    </div>
    <div class="sum-row" id="taxRow">
      <label class="switch">
        <input type="checkbox" id="iva" checked />
        <span>IVA 19%</span>
      </label>
      <strong id="tax">$ 0</strong>
    </div>
    <div class="sum-total">
      <span>Total</span>
      <strong id="total">$ 0</strong>
    </div>
  </section>

  <!-- ======= Acciones ======= -->
  <footer class="actions">
    <p class="legal">Documento generado automáticamente. Requiere firma y sello para validez fiscal.</p>
    <div class="actions-right">
      <button class="btn btn-ghost" id="newBtn" type="button">Nueva factura</button>
      <button class="btn btn-ghost" id="saveBtn" type="button">Guardar borrador</button>
      <button class="btn btn-gold" id="printBtn" type="button">Imprimir / PDF</button>
    </div>
  </footer>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  const $  = (s) => document.querySelector(s);
  const rowsEl   = $("#rows");
  const ivaInput = $("#iva");
  const taxRow   = $("#taxRow");
  const subEl    = $("#subtotal");
  const taxEl    = $("#tax");
  const totalEl  = $("#total");
  const statusText = $("#statusText");
  const toastEl  = $("#toast");

  const nf = new Intl.NumberFormat("es-CO", {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  });
  const money = (n) => "$ " + nf.format(Number.isFinite(n) ? n : 0);
  const esc = (s) => String(s)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  /* ---------- Aviso flotante ---------- */
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  function setStatus(text) {
    statusText.textContent = text;
  }

  /* ---------- Filas ---------- */
  function addRow(desc = "", qty = 1, price = 0) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <input class="r-desc" type="text" placeholder="Descripción del concepto" value="${esc(desc)}" />
      <input class="r-qty" type="number" min="0" step="1" value="${esc(qty)}" aria-label="Cantidad" />
      <input class="r-price" type="number" min="0" step="0.01" value="${esc(price)}" aria-label="Precio unitario" />
      <div class="r-amount">$ 0</div>
      <button class="r-del" type="button" title="Eliminar concepto" aria-label="Eliminar concepto">&times;</button>
    `;
    rowsEl.appendChild(row);
    calculate();
  }

  /* ---------- Cálculo ---------- */
  function calculate() {
    let subtotal = 0;

    rowsEl.querySelectorAll(".row").forEach((row) => {
      const qty   = parseFloat(row.querySelector(".r-qty").value) || 0;
      const price = parseFloat(row.querySelector(".r-price").value) || 0;
      const amount = qty * price;
      row.querySelector(".r-amount").textContent = money(amount);
      subtotal += amount;
    });

    const rate = ivaInput.checked ? 0.19 : 0;
    const tax  = subtotal * rate;
    const total = subtotal + tax;

    subEl.textContent  = money(subtotal);
    taxEl.textContent  = money(tax);
    totalEl.textContent = money(total);

    taxRow.style.opacity = ivaInput.checked ? "1" : ".45";
  }

  /* ---------- Eventos de filas ---------- */
  rowsEl.addEventListener("input", (e) => {
    if (e.target.matches("input")) calculate();
  });

  rowsEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".r-del");
    if (!btn) return;

    const rows = rowsEl.querySelectorAll(".row");
    if (rows.length === 1) {
      const r = rows[0];
      r.querySelector(".r-desc").value  = "";
      r.querySelector(".r-qty").value   = "1";
      r.querySelector(".r-price").value = "0";
    } else {
      btn.closest(".row").remove();
    }
    calculate();
  });

  $("#addBtn").addEventListener("click", () => {
    addRow("", 1, 0);
    const rows = rowsEl.querySelectorAll(".row");
    rows[rows.length - 1].querySelector(".r-desc").focus();
  });

  ivaInput.addEventListener("change", calculate);

  /* ---------- Fechas y numeración ---------- */
  const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);

  const today = new Date();
  const plusDays = (d, n) => new Date(d.getTime() + n * 86400000);

  function nextNumber() {
    const year = new Date().getFullYear();
    const rand = Math.floor(1000 + Math.random() * 9000);
    return `FAC-${year}-${rand}`;
  }

  function resetDates() {
    $("#issueDate").value = iso(today);
    $("#dueDate").value   = iso(plusDays(today, 15));
  }

  /* ---------- Acciones ---------- */
  $("#newBtn").addEventListener("click", () => {
    $("#clientName").value  = "";
    $("#clientDoc").value   = "";
    $("#clientEmail").value = "";
    $("#invNumber").value   = nextNumber();
    resetDates();

    rowsEl.innerHTML = "";
    addRow("", 1, 0);
    ivaInput.checked = true;
    calculate();

    setStatus("Borrador");
    toast("Nueva factura creada");
    $("#clientName").focus();
  });

  $("#saveBtn").addEventListener("click", () => {
    const data = {
      invNumber: $("#invNumber").value,
      client: {
        name:  $("#clientName").value,
        doc:   $("#clientDoc").value,
        email: $("#clientEmail").value
      },
      issueDate: $("#issueDate").value,
      dueDate:   $("#dueDate").value,
      iva: ivaInput.checked,
      rows: Array.from(rowsEl.querySelectorAll(".row")).map((r) => ({
        desc:  r.querySelector(".r-desc").value,
        qty:   r.querySelector(".r-qty").value,
        price: r.querySelector(".r-price").value
      })),
      savedAt: new Date().toISOString()
    };

    try {
      localStorage.setItem("core_invoice_draft", JSON.stringify(data));
      setStatus("Guardada");
      toast("Borrador guardado");
    } catch (err) {
      toast("No se pudo guardar el borrador");
    }
  });

  $("#printBtn").addEventListener("click", () => {
    toast("Preparando documento…");
    setTimeout(() => window.print(), 320);
  });

  /* ---------- Arranque ---------- */
  function boot() {
    $("#invNumber").value = nextNumber();
    resetDates();

    addRow("Consultoría estratégica", 1, 2400000);
    addRow("Diseño de identidad visual", 1, 1800000);
    addRow("Soporte y mantenimiento", 3, 320000);

    calculate();
  }

  boot();
})();
</script>
</body>
</html>
