<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gestión de Facturas — Multi Admisiones</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace; }
    table { border-collapse: separate; border-spacing: 0; }

    .fade-in {
      animation: fadeIn 0.35s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .processing {
      position: relative;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.7;
    }
    .processing::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      to { left: 100%; }
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(14, 165, 233, 0.2);
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .header-gradient {
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
      border-bottom: 1px solid #e2e8f0;
    }

    .card-shadow {
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }
    .card-shadow:hover {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .progress-bar {
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .badge-animate {
      animation: badgePop 0.3s ease-out;
    }
    @keyframes badgePop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      animation: toastSlide 0.3s ease-out;
      z-index: 1000;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    @keyframes toastSlide {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-slate-50 to-slate-100 text-slate-800 min-h-screen pb-20">

<div class="max-w-6xl mx-auto p-6">

<header class="mb-8 header-gradient rounded-lg p-6 card-shadow">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-bold text-slate-900 mb-2">Gestión de Facturas</h1>
      <p class="text-sm text-slate-600">
        Flujo: <span class="font-medium text-slate-700">Buscar → Cambiar Fecha → Generar → DIAN</span>
      </p>
    </div>
    <div class="hidden md:flex items-center gap-2 px-4 py-2 bg-sky-50 rounded-lg border border-sky-100">
      <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
      <span id="hostIndicator" class="text-sm font-medium text-sky-700 font-mono">Cargando servidor...</span>
    </div>
  </div>
</header>

<main class="grid gap-6">

  <section class="bg-white rounded-xl shadow-sm p-6 card-shadow">
    <div class="grid md:grid-cols-2 gap-8">
      
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Institución</label>
          <select id="selInstitucion" class="w-full rounded-lg border-2 border-slate-200 p-3 bg-white focus:border-sky-400 outline-none">
            <option value="20">🏥 ESE HOSPITAL SAN JORGE AYAPEL (ID: 20)</option>
            <option value="14">🏥 CENTRO DE SALUD SAN JOSE DE TOLUVIEJO (ID: 14)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Números de Admisión (uno por línea)</label>
          <textarea id="admisionLista" class="w-full rounded-lg border-2 border-slate-200 p-4 h-40 mono text-sm focus:border-sky-400 outline-none resize-none" placeholder="39842&#10;178947"></textarea>
        </div>
      </div>

      <div class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Nueva Fecha (DD/MM/YYYY)</label>
          <input id="fechaInput" type="text" class="w-full rounded-lg border-2 border-slate-200 p-3 focus:border-sky-400 outline-none" placeholder="19/11/2025" />
        </div>

        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Acciones Secuenciales</p>
          <label class="flex items-center gap-3 cursor-pointer group">
            <input id="chkCambiar" type="checkbox" class="h-5 w-5 rounded border-slate-300 text-sky-600" checked />
            <span class="text-sm font-medium text-slate-700">1. Cambiar fecha de emisión</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer group">
            <input id="chkGenerar" type="checkbox" class="h-5 w-5 rounded border-slate-300 text-sky-600" />
            <span class="text-sm font-medium text-slate-700">2. Generar número de factura</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer group">
            <input id="chkEnviar" type="checkbox" class="h-5 w-5 rounded border-slate-300 text-sky-600" />
            <span class="text-sm font-medium text-slate-700">3. Enviar a DIAN</span>
          </label>
        </div>
      </div>
    </div>

    <div class="mt-8 flex flex-wrap gap-3 pt-6 border-t border-slate-100">
      <button id="ejecutarBtn" class="px-8 py-3 bg-sky-600 hover:bg-sky-700 text-white rounded-lg shadow-md font-bold flex items-center gap-2 transition-all active:scale-95">
        Ejecutar Procesamiento
      </button>
      <button id="limpiarBtn" class="px-6 py-3 border-2 border-slate-200 hover:bg-slate-50 rounded-lg text-slate-600 font-medium">
        Limpiar campos
      </button>
      <button id="vaciarTablaBtn" class="px-6 py-3 border-2 border-red-100 text-red-500 hover:bg-red-50 rounded-lg font-medium ml-auto">
        Vaciar tabla
      </button>
    </div>
  </section>

  <section class="bg-white rounded-xl shadow-sm p-6 card-shadow">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-bold text-slate-800">Progreso y Resultados</h3>
      <span id="progressPct" class="text-sm font-bold text-sky-600 bg-sky-50 px-3 py-1 rounded-full">0%</span>
    </div>
    
    <div class="w-full bg-slate-100 rounded-full h-3 mb-6 overflow-hidden">
      <div id="progressBar" class="h-full bg-sky-500 progress-bar" style="width: 0%"></div>
    </div>

    <div class="overflow-x-auto border border-slate-100 rounded-lg">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 text-slate-600 font-semibold">
          <tr>
            <th class="px-4 py-3 border-b">Admisión</th>
            <th class="px-4 py-3 border-b">ID Factura</th>
            <th class="px-4 py-3 border-b">Nº Factura</th>
            <th class="px-4 py-3 border-b">Estado / Pasos</th>
            <th class="px-4 py-3 border-b text-center">Acción</th>
          </tr>
        </thead>
        <tbody id="resultsTableBody" class="divide-y divide-slate-50"></tbody>
      </table>
    </div>
  </section>

</main>
</div>

<div id="toastContainer"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Referencias
    const btnEjecutar = document.getElementById('ejecutarBtn');
    const btnLimpiar = document.getElementById('limpiarBtn');
    const btnVaciar = document.getElementById('vaciarTablaBtn');
    const txtAdmisiones = document.getElementById('admisionLista');
    const inputFecha = document.getElementById('fechaInput');
    const selInstitucion = document.getElementById('selInstitucion');
    const tableBody = document.getElementById('resultsTableBody');
    const progressBar = document.getElementById('progressBar');
    const progressPct = document.getElementById('progressPct');
    const hostIndicator = document.getElementById('hostIndicator');

    // DINÁMICO: Toma la URL de donde se cargó el archivo
    const API_BASE = window.location.origin; 
    hostIndicator.innerText = `Servidor: ${API_BASE}`;

    function notify(msg, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast ${type === 'error' ? 'bg-red-500' : 'bg-slate-800'}`;
        toast.innerText = msg;
        document.getElementById('toastContainer').appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
    }

    function createRow(admision) {
        const tr = document.createElement('tr');
        tr.className = 'fade-in hover:bg-slate-50 transition-colors';
        tr.id = `row-${admision}`;
        tr.innerHTML = `
            <td class="px-4 py-4 font-mono font-bold text-slate-700">${admision}</td>
            <td class="px-4 py-4 text-slate-500" id="idF-${admision}">-</td>
            <td class="px-4 py-4 font-medium text-sky-700" id="numF-${admision}">-</td>
            <td class="px-4 py-4"><div id="status-${admision}" class="text-xs flex flex-wrap gap-1"><span class="text-slate-400 italic">Esperando...</span></div></td>
            <td class="px-4 py-4 text-center"><button onclick="this.closest('tr').remove()" class="text-slate-300 hover:text-red-500">✕</button></td>
        `;
        tableBody.prepend(tr);
    }

    function addBadge(admision, text, theme) {
        const container = document.getElementById(`status-${admision}`);
        if (container.querySelector('span.italic')) container.innerHTML = '';
        const themes = {
            success: 'bg-green-100 text-green-700 border-green-200',
            info: 'bg-blue-100 text-blue-700 border-blue-200',
            error: 'bg-red-100 text-red-700 border-red-200',
            process: 'bg-sky-50 text-sky-700 border-sky-100'
        };
        const span = document.createElement('span');
        span.className = `px-2 py-0.5 rounded border text-[10px] font-bold uppercase badge-animate ${themes[theme]}`;
        span.innerText = text;
        container.appendChild(span);
    }

    async function processInvoice(admision, idInstitucion, nuevaFecha) {
        const idFacturaCell = document.getElementById(`idF-${admision}`);
        const numFacturaCell = document.getElementById(`numF-${admision}`);
        
        try {
            // 0. BUSCAR FACTURA
            addBadge(admision, 'Buscando...', 'process');
            const resSearch = await fetch(`${API_BASE}/buscarFactura?numero=${admision}&idInstitucion=${idInstitucion}`, { method: 'POST' });
            const dataSearch = await resSearch.json();

            if (!dataSearch.ok || !dataSearch.idFactura) throw new Error("No existe");
            
            const idFactura = dataSearch.idFactura;
            idFacturaCell.innerText = idFactura;
            addBadge(admision, 'ID: OK', 'info');

            // 1. CAMBIAR FECHA
            if (document.getElementById('chkCambiar').checked) {
                if (!nuevaFecha) throw new Error("Falta fecha");
                const resDate = await fetch(`${API_BASE}/cambiar-fecha`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idFactura: idFactura, fechaEmision: nuevaFecha })
                });
                const dataDate = await resDate.json();
                if (dataDate.ok) addBadge(admision, 'Fecha OK', 'success');
            }

            // 2. GENERAR NÚMERO
            if (document.getElementById('chkGenerar').checked) {
                const resNum = await fetch(`${API_BASE}/GenerarNumeroFactura?idFacturas=${idFactura}&Idinstitucion=${idInstitucion}`);
                const dataNum = await resNum.json();
                if (dataNum.resultado && dataNum.resultado.numeroFactura) {
                    numFacturaCell.innerText = dataNum.resultado.numeroFactura;
                    addBadge(admision, `Fact: ${dataNum.resultado.numeroFactura}`, 'success');
                }
            }

            // 3. ENVIAR DIAN
            if (document.getElementById('chkEnviar').checked) {
                const resDian = await fetch(`${API_BASE}/EnviarDian`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idFacturas: idFactura.toString() })
                });
                const dataDian = await resDian.json();
                if (dataDian.valorRetorno === 1) addBadge(admision, 'DIAN OK', 'success');
                else throw new Error(dataDian.mensajeRetorno || "Error DIAN");
            }

        } catch (err) {
            addBadge(admision, err.message, 'error');
        }
    }

    btnEjecutar.addEventListener('click', async () => {
        const lineas = txtAdmisiones.value.split('\n').map(l => l.trim()).filter(l => l !== "");
        if (lineas.length === 0) return notify("Lista vacía", "error");

        const idInst = selInstitucion.value;
        const fecha = inputFecha.value;

        btnEjecutar.classList.add('processing');
        btnEjecutar.innerText = "Procesando...";

        let count = 0;
        for (const adm of lineas) {
            createRow(adm);
            await processInvoice(adm, idInst, fecha);
            count++;
            const pct = Math.round((count / lineas.length) * 100);
            progressBar.style.width = pct + '%';
            progressPct.innerText = pct + '%';
        }

        btnEjecutar.classList.remove('processing');
        btnEjecutar.innerText = "Ejecutar Procesamiento";
        notify(`Terminado: ${count} registros.`);
    });

    btnLimpiar.addEventListener('click', () => {
        txtAdmisiones.value = "";
        inputFecha.value = "";
    });

    btnVaciar.addEventListener('click', () => {
        tableBody.innerHTML = "";
        progressBar.style.width = '0%';
        progressPct.innerText = '0%';
    });
});
</script>

</body>
</html>
